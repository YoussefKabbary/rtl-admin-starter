[project]
name = "rtl-admin-starter"
version = "0.1.0"
description = "Arabic RTL-first admin dashboard starter on FastAPI"
requires-python = ">=3.10"
license = "MIT"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["S101"]   # assert is how pytest works

[tool.ruff.lint.per-file-ignores]
"app.py" = ["S105", "S608"]   # demo default password; f-string only joins a fixed WHERE clause
